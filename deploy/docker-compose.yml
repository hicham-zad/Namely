# matchbabynames.com production on the VPS (/opt/namely). Public traffic arrives only via the
# Cloudflare Tunnel (cloudflared -> 127.0.0.1:3200) for matchbabynames.com and www.

services:
  web:
    build: ./web
    container_name: namely-web
    restart: unless-stopped
    env_file: ./.env.production
    ports:
      - "127.0.0.1:3200:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
